[pytest]
testpaths = tests
asyncio_mode = auto

# Deprecations in our own code should fail the build; the ones our
# dependencies emit against each other on newer Pythons are not ours to fix.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
